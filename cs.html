<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadro de Demanda</title>
    <style>
        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    
<table>
    <tr>
        <th>Demanda</th>
        <td>Criação de Sistema de Gestão</td>
    </tr>
    <tr>
        <th>Descrição</th>
        <td>Criação de um sistema para gestão de atividades e fluxos de trabalho internos.</td>
    </tr>
    <tr>
        <th>Prazo de entrega</th>
        <td>30 dias</td>
    </tr>
    <tr>
        <th>Equipe envolvida</th>
        <td>Desenvolvimento, Design e Suporte Técnico</td>
    </tr>
    <tr>
        <th>Ferramentas necessárias</th>
        <td>React, Node.js, MongoDB</td>
    </tr>
    <tr>
        <th>Orçamento</th>
        <td>R$ 50.000,00</td>
    </tr>
</table>
</body>
</html>
